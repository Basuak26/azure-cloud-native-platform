trigger:
  branches:
    include:
      - main

variables:
  - group: azure-platform-vars
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRegistryServiceConnection
    value: 'AcrConnection'
  - name: azureResourceManagerConnection
    value: 'ArmConnection'

stages:
- stage: Build
  displayName: 'Build and Push'
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Restore API'
      inputs:
        command: 'restore'
        projects: 'src/Api/Api.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build API'
      inputs:
        command: 'build'
        projects: 'src/Api/Api.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: Docker@2
      displayName: 'Build and Push API Image'
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: 'api'
        command: 'buildAndPush'
        Dockerfile: 'src/Api/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Build and Push Worker Image'
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: 'worker'
        command: 'buildAndPush'
        Dockerfile: 'src/Worker/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - publish: infra
      artifact: infra

- stage: Deploy_DEV
  displayName: 'Deploy to DEV'
  dependsOn: Build
  condition: succeeded()
  variables:
    envName: 'dev'
  jobs:
  - deployment: DeployInfra
    environment: 'DEV'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy Bicep to DEV'
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(azureResourceManagerConnection)'
              subscriptionId: '$(subscriptionId)'
              action: 'Create Or Update Resource Group'
              resourceGroupName: 'rg-azplat-dev'
              location: 'eastus'
              templateLocation: 'Linked artifact'
              csmFile: '$(Pipeline.Workspace)/infra/main.bicep'
              overrideParameters: '-envName dev -apiImage $(acrLoginServer)/api:$(Build.BuildId) -workerImage $(acrLoginServer)/worker:$(Build.BuildId)'
              deploymentMode: 'Incremental'

- stage: Deploy_PPD
  displayName: 'Deploy to PPD'
  dependsOn: Deploy_DEV
  condition: succeeded()
  variables:
    envName: 'ppd'
  jobs:
  - deployment: DeployInfra
    environment: 'PPD' # Pre-prod environment (needs manual approval in ADO)
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy Bicep to PPD'
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(azureResourceManagerConnection)'
              subscriptionId: '$(subscriptionId)'
              action: 'Create Or Update Resource Group'
              resourceGroupName: 'rg-azplat-ppd'
              location: 'eastus'
              templateLocation: 'Linked artifact'
              csmFile: '$(Pipeline.Workspace)/infra/main.bicep'
              overrideParameters: '-envName ppd -apiImage $(acrLoginServer)/api:$(Build.BuildId) -workerImage $(acrLoginServer)/worker:$(Build.BuildId)'
              deploymentMode: 'Incremental'
