parameters:
  - name: deployDev
    displayName: 'Deploy to DEV Environment (East US)'
    type: boolean
    default: true
  - name: deployPpd
    displayName: 'Deploy to PPD Environment (Central US)'
    type: boolean
    default: false

trigger:
  - main

variables:
  - group: azure-platform-vars
  - name: azureResourceManagerConnection
    value: 'ArmConnection'

stages:
# ==========================================
# DEV STAGE
# ==========================================
- stage: Deploy_DEV
  displayName: 'Deploy to DEV'
  dependsOn: [] # Allows this stage to run independently!
  condition: eq('${{ parameters.deployDev }}', true)
  variables:
    envName: 'dev'
    rgName: 'rg-azplat-dev'
    location: 'eastus'
  jobs:
  - job: ProvisionAndBuildDEV
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Provision DEV Infrastructure (Bicep)'
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: '$(azureResourceManagerConnection)'
        subscriptionId: '$(subscriptionId)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(rgName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: 'infra/main.bicep'
        overrideParameters: '-envName $(envName)'
        deploymentMode: 'Incremental'
        deploymentOutputs: 'bicepOutputs'

    - task: PowerShell@2
      displayName: 'Parse DEV Bicep Outputs'
      inputs:
        targetType: 'inline'
        script: |
          $outputs = ConvertFrom-Json '$(bicepOutputs)'
          $acrLoginServer = $outputs.acrLoginServer.value
          Write-Host "##vso[task.setvariable variable=acrLoginServer]$acrLoginServer"

    - task: AzureCLI@2
      displayName: 'Build and Push DEV Docker Images'
      inputs:
        azureSubscription: '$(azureResourceManagerConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          ACR_NAME=$(echo $(acrLoginServer) | cut -d'.' -f1)
          az acr login --name $ACR_NAME
          docker build -f src/Api/Dockerfile -t $(acrLoginServer)/api:$(Build.BuildId) src/Api
          docker push $(acrLoginServer)/api:$(Build.BuildId)
          docker build -f src/Worker/Dockerfile -t $(acrLoginServer)/worker:$(Build.BuildId) src/Worker
          docker push $(acrLoginServer)/worker:$(Build.BuildId)

    - task: AzureCLI@2
      displayName: 'Update DEV Container Apps'
      inputs:
        azureSubscription: '$(azureResourceManagerConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az containerapp update --name ca-api-$(envName) --resource-group $(rgName) --image $(acrLoginServer)/api:$(Build.BuildId)
          az containerapp update --name ca-worker-$(envName) --resource-group $(rgName) --image $(acrLoginServer)/worker:$(Build.BuildId)

# ==========================================
# PPD STAGE
# ==========================================
- stage: Deploy_PPD
  displayName: 'Deploy to PPD'
  dependsOn: [] # Allows this stage to run independently!
  condition: eq('${{ parameters.deployPpd }}', true)
  variables:
    envName: 'ppd'
    rgName: 'rg-azplat-ppd'
    location: 'centralus' # Bypasses free tier limits
  jobs:
  - job: ProvisionAndBuildPPD
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureResourceManagerTemplateDeployment@3
      displayName: 'Provision PPD Infrastructure (Bicep)'
      inputs:
        deploymentScope: 'Resource Group'
        azureResourceManagerConnection: '$(azureResourceManagerConnection)'
        subscriptionId: '$(subscriptionId)'
        action: 'Create Or Update Resource Group'
        resourceGroupName: '$(rgName)'
        location: '$(location)'
        templateLocation: 'Linked artifact'
        csmFile: 'infra/main.bicep'
        overrideParameters: '-envName $(envName)'
        deploymentMode: 'Incremental'
        deploymentOutputs: 'bicepOutputs'

    - task: PowerShell@2
      displayName: 'Parse PPD Bicep Outputs'
      inputs:
        targetType: 'inline'
        script: |
          $outputs = ConvertFrom-Json '$(bicepOutputs)'
          $acrLoginServer = $outputs.acrLoginServer.value
          Write-Host "##vso[task.setvariable variable=acrLoginServer]$acrLoginServer"

    - task: AzureCLI@2
      displayName: 'Build and Push PPD Docker Images'
      inputs:
        azureSubscription: '$(azureResourceManagerConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          ACR_NAME=$(echo $(acrLoginServer) | cut -d'.' -f1)
          az acr login --name $ACR_NAME
          docker build -f src/Api/Dockerfile -t $(acrLoginServer)/api:$(Build.BuildId)-ppd src/Api
          docker push $(acrLoginServer)/api:$(Build.BuildId)-ppd
          docker build -f src/Worker/Dockerfile -t $(acrLoginServer)/worker:$(Build.BuildId)-ppd src/Worker
          docker push $(acrLoginServer)/worker:$(Build.BuildId)-ppd

    - task: AzureCLI@2
      displayName: 'Update PPD Container Apps'
      inputs:
        azureSubscription: '$(azureResourceManagerConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az containerapp update --name ca-api-$(envName) --resource-group $(rgName) --image $(acrLoginServer)/api:$(Build.BuildId)-ppd
          az containerapp update --name ca-worker-$(envName) --resource-group $(rgName) --image $(acrLoginServer)/worker:$(Build.BuildId)-ppd
